<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            text-align: center;
            color: white;
            padding: 40px;
        }
        h1 {
            font-size: 72px;
            margin: 0 0 20px 0;
            font-weight: 700;
            letter-spacing: -2px;
        }
        p {
            font-size: 36px;
            margin: 0;
            opacity: 0.95;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Candela Dengra</h1>
        <p>Full-Stack Developer</p>
        <p style="font-size: 28px; margin-top: 10px;">Python/Django · React/TypeScript</p>
    </div>
</body>
</html>
